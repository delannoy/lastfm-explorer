<!DOCTYPE html>

<html lang='en'>

<head>

    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>NowPlaying</title>

    <style>
        a {
            color: inherit; text-decoration: none;
            transition: opacity 0.2s ease-in-out;
        }
        a[href]:hover {
            opacity: 0.6;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; background: #050505; color: #fff;
        }
        .bg {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover; background-position: center;
            filter: blur(30px) saturate(1.2); z-index: 0; transition: background-image 1.5s ease-in-out;
        }
        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); z-index: 1;
        }
        .datetime-container {
            position: absolute; top: 25px; left: 25px; z-index: 10;
            text-align: left; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .time-display {
            font-size: 2.5rem; font-weight: 300; margin-bottom: 2px;
            letter-spacing: 1px; display: block;
        }
        .date-display {
            font-size: 0.9rem; color: #ccc; text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 500;
        }
        .weather-container {
            position: absolute; top: 25px; right: 25px; z-index: 10;
            text-align: right; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            display: none;
        }
        .weather-temperature {
            font-size: 2.5rem; font-weight: 300; margin-bottom: 2px;
            letter-spacing: 1px; display: flex; align-items: center; justify-content: flex-end; gap: 10px;
        }
        .weather-description {
            font-size: 0.9rem; color: #ccc; text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 500;
        }
        .weather-location {
            font-size: 1rem; color: #ccc; font-weight: 500;
        }
        .weather-forecast {
            font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 5px;
            letter-spacing: 1px; display: block;
        }
        .stats-container {
            position: absolute; bottom: 20px; left: 25px; z-index: 10;
            text-align: left; text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 4px;
        }
        .stat-label {
            font-size: 0.75rem; color: rgba(255,255,255,0.5);
            text-transform: uppercase; letter-spacing: 1px;
        }
        .stat-value {
            font-size: 1rem; color: #e0e0e0; font-weight: 500; display: block;
        }
        .content {
            position: absolute; z-index: 2;
            top: 110px;
            bottom: 90px;
            left: 0; width: 100%; height: auto;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; box-sizing: border-box; padding: 0 20px;
            overflow-y: auto;
        }
        .album-art {
            width: 35vh; height: 35vh; max-width: 400px; max-height: 400px;
            object-fit: cover; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 8px; margin-bottom: 25px; transition: opacity 0.5s;
            display: none; flex-shrink: 0;
        }
        .track-container {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin: 0 0 10px 0; max-width: 80%;
        }
        .track-name {
            font-size: 2.5rem; font-weight: 700; margin: 0 0 10px 0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5); letter-spacing: -1px;
            max-width: 80%; display: block;
        }
        .loved-icon {
            font-size: 2.2rem; color: #ff3b3b;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5); display: none;
        }
        .artist-name {
            font-size: 1.75rem; color: #e0e0e0;
            font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,0.5); display: block;
        }
        .album-name {
            font-size: 1.25rem; color: #aaa; font-style: italic;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); display: block;
        }
        .info-container {
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;
        }
        .mb-badge {
            display: none; width: 22px; height: 22px;
            opacity: 0.5; transition: opacity 0.2s ease-in-out;
            flex-shrink: 0;
        }
        .mb-badge:hover {
            opacity: 1;
        }
        .mb-badge svg, .mb-badge img {
            width: 100%; height: 100%; border: none; object-fit: contain;
        }
        .hidden-cursor, .hidden-cursor * {
            cursor: none !important;
        }
        .status {
            position: absolute; bottom: 20px; right: 25px;
            font-size: 1.25rem; color: rgba(255,255,255,0.4); z-index: 10;
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .date-wrapper {
            position: relative; display: inline-block; cursor: default;
        }
        .calendar-popup {
            display: none; position: absolute; top: 100%; left: 0;
            margin-top: 8px; width: 250px; z-index: 20;
            background: rgba(15, 15, 15, 0.95); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            text-shadow: none; color: #ddd;
        }
        .calendar-popup::before {
            content: ''; position: absolute;
            top: -15px; left: 0; right: 0; height: 15px;
        }
        .cal-grid {
            display: grid; 
            grid-template-columns: 24px repeat(7, 1fr);
            gap: 4px; text-align: center; font-size: 0.8rem;
        }
        .cal-wk-num {
            font-weight: 700; color: rgba(255, 255, 255, 0.25); font-size: 0.7rem; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.05); border-radius: 4px; margin-right: 4px;
        }
        .date-wrapper:hover .calendar-popup {
            display: block;
        }
        .cal-header {
            text-align: center; font-weight: 600; color: #fff; 
            margin-bottom: 12px; font-size: 0.9rem; letter-spacing: 1px;
        }
        .cal-day-name {
            font-weight: 700; color: rgba(255, 255, 255, 0.4); margin-bottom: 4px;
        }
        .cal-day {
            padding: 4px 0; border-radius: 4px;
        }
        .cal-today {
            background: #fff; color: #000; font-weight: 700;
        }
        .cal-empty {
            visibility: hidden;
        }
    </style>

</head>

<body>

    <div class='bg' id='bg'></div>

    <div class='bg-overlay'></div>

    <div class='datetime-container'>
        <a id='time' class='time-display' href='https://time.is/' target='_blank'>--:--</a>
        <div class='date-wrapper'>
            <div id='date' class='date-display'>Loading...</div>
            <div id='calendar-popup' class='calendar-popup'></div>
        </div>
    </div>

    <div id='weather-container' class='weather-container'>
        <div id='weather-location' class='weather-location'>Loading...</div>
        <div class='weather-temperature'>
            <span id='weather-emoji'></span>
            <a id='weather-temperature' target='_blank'>--°C</a>
        </div>
        <div id='weather-description' class='weather-description'>Loading...</div>
        <a id='weather-forecast' class='weather-forecast' target='_blank'>↑ --° | ↓ --° | ☔ --%</a>
    </div>

    <div class='content'>
        <a id='cover-link' target='_blank'>
            <img id='cover' class='album-art' src=''>
        </a>
        <div class='track-container'>
            <a id='track' class='track-name' target='_blank'>Waiting for music...</a>
            <a id='mb-track' class='mb-badge' target='_blank' title='View on MusicBrainz'></a>
            <a id='loved' class='loved-icon' target='_blank'>♥</a>
        </div>
        <div class='info-container'>
            <a id='artist' class='artist-name' target='_blank'></a>
            <a id='mb-artist' class='mb-badge' target='_blank' title='View on MusicBrainz'></a>
        </div>
        <div class='info-container'>
            <a id='album' class='album-name' target='_blank'></a>
            <a id='mb-album' class='mb-badge' target='_blank' title='View on MusicBrainz'></a>
        </div>
    </div>

    <div class='stats-container'>
        <div>
            <div class='stat-label'>Total Listens</div>
            <a id='total-listens' class='stat-value' target='_blank'>--</a>
        </div>
        <div style='margin-top: 5px;'>
            <div class='stat-label'>Track Listens</div>
            <a id='track-plays' class='stat-value' target='_blank'>--</a>
        </div>
    </div>

    <a class='status' id='status' target='_blank'>CONNECTING...</a>

    <script>

        const DOM = {
            time: document.getElementById('time'),
            date: document.getElementById('date'),
            calendarPopup: document.getElementById('calendar-popup'),
            weatherLocation: document.getElementById('weather-location'),
            weatherTemperature: document.getElementById('weather-temperature'),
            weatherEmoji: document.getElementById('weather-emoji'),
            weatherDescription: document.getElementById('weather-description'),
            weatherForecast: document.getElementById('weather-forecast'),
            weatherContainer: document.getElementById('weather-container'),
            cover: document.getElementById('cover'),
            coverLink: document.getElementById('cover-link'),
            bg: document.getElementById('bg'),
            track: document.getElementById('track'),
            mbTrack: document.getElementById('mb-track'),
            loved: document.getElementById('loved'),
            artist: document.getElementById('artist'),
            mbArtist: document.getElementById('mb-artist'),
            album: document.getElementById('album'),
            mbAlbum: document.getElementById('mb-album'),
            totalListens: document.getElementById('total-listens'),
            trackPlays: document.getElementById('track-plays'),
            status: document.getElementById('status')
        };

        const MOUSE_TIMEOUT = 3 * 1000 // 3 seconds
        const POLL_MUSIC_MS = 10 * 1000; // 10 seconds
        const POLL_WEATHER_MS = 10 * 60 * 1000; // 10 minutes

        const MB_LOGO_SVG = `<img src="https://musicbrainz.org/favicon.ico" alt="MB" />`;
        DOM.mbTrack.innerHTML = MB_LOGO_SVG;
        DOM.mbArtist.innerHTML = MB_LOGO_SVG;
        DOM.mbAlbum.innerHTML = MB_LOGO_SVG;

        let timeout;

        document.onmousemove = function() {
            document.body.classList.remove('hidden-cursor');
            clearTimeout(timeout);
            timeout = setTimeout(() => document.body.classList.add('hidden-cursor'), MOUSE_TIMEOUT);
        };

        let lastDateString = null;

        function getISOWeek(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        function generateCalendar(now) {
            const year = now.getFullYear();
            const month = now.getMonth();
            const today = now.getDate();
            const firstDay = (new Date(year, month, 1).getDay() + 6) % 7; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const monthName = now.toLocaleDateString([], { month: 'long', year: 'numeric' });
            let html = `<div class="cal-header">${monthName}</div><div class="cal-grid">`;
            const dayNames = ['Wk', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
            dayNames.forEach(d => { html += `<div class="cal-day-name">${d}</div>`; });
            const totalCells = firstDay + daysInMonth;
            const rows = Math.ceil(totalCells / 7);
            let d = 1;
            for (let r = 0; r < rows; r++) {
                const thursdayDate = new Date(year, month, (r * 7) - firstDay + 4);
                const wk = getISOWeek(thursdayDate);
                html += `<div class="cal-wk-num">${wk}</div>`;
                for (let c = 0; c < 7; c++) {
                    if (r === 0 && c < firstDay) {
                        html += `<div class="cal-empty"></div>`;
                    } else if (d > daysInMonth) {
                        html += `<div class="cal-empty"></div>`;
                    } else {
                        const isToday = d === today ? 'cal-today' : '';
                        html += `<div class="cal-day ${isToday}">${d}</div>`;
                        d++;
                    }
                }
            }
            html += `</div>`;
            DOM.calendarPopup.innerHTML = html;
        }

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', hour12: false, minute: '2-digit', second: '2-digit' });
            const dateString = now.toLocaleDateString([], { day: 'numeric', month: 'long', weekday: 'long', year: 'numeric' });
            DOM.time.innerText = timeString;
            if (dateString !== lastDateString) {
                DOM.date.innerText = dateString;
                generateCalendar(now);
                lastDateString = dateString;
            }
        }

        updateClock();
        setInterval(updateClock, 1000);

        function setLink(element, text, url) {
            if (text !== null) {
                element.innerText = text;
            }
            if (url) {
                element.href = url;
            } else {
                element.removeAttribute('href');
            }
        }

        function setMBLink(element, url) {
            if (url) {
                element.href = url;
                element.style.display = 'block';
            } else {
                element.style.display = 'none';
            }
        }

        async function fetchWeather() {
            try {
                const res = await fetch('api/weather');
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                const data = await res.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                DOM.weatherLocation.innerText = data.location;
                setLink(DOM.weatherTemperature, data.temperature + '°C', data.current_url);
                DOM.weatherEmoji.innerText = data.emoji;
                DOM.weatherDescription.innerText = data.description;
                setLink(DOM.weatherForecast, '↑ ' + data.high + '° | ↓ ' + data.low + '° | ☔ ' + data.precipitation + '%', data.forecast_url);
                DOM.weatherContainer.style.display = 'block';
            } catch (err) {
                console.error('Weather error:', err);
                DOM.weatherLocation.innerText = 'Unknown';
                setLink(DOM.weatherTemperature, '--°C', null);
                DOM.weatherEmoji.innerText = '⚠️';
                DOM.weatherDescription.innerText = err.message;
                setLink(DOM.weatherForecast, '↑ --° | ↓ --° | ☔ --%', null);
                DOM.weatherContainer.style.display = 'block';
            }
        }

        fetchWeather();
        setInterval(fetchWeather, POLL_WEATHER_MS);

        let state = null;

        async function fetchNowPlaying() {
            try {
                const res = await fetch('api/nowplaying');
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                const data = await res.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                setLink(DOM.totalListens, parseInt(data.total_listens).toLocaleString(), data.user_url + '/library');
                setLink(DOM.trackPlays, parseInt(data.track_listens).toLocaleString(), data.track_library_url);
                setLink(DOM.status, data.playing ? data.user.toUpperCase() + ': NOW PLAYING' : data.user.toUpperCase() + ': LAST LISTEN', data.playing ? data.user_url + '/now' : data.user_url);
                const currentState = data.track + '|' + data.artist + '|' + data.playing;
                if (currentState === state) {
                    return;
                }
                state = currentState;
                setLink(DOM.track, data.track || 'Unknown Track', data.track_url);
                setLink(DOM.artist, data.artist || 'Unknown Artist', data.artist_url);
                setLink(DOM.album, data.album || '', data.album_url);
                setMBLink(DOM.mbTrack, data.track_mb_url);
                setMBLink(DOM.mbArtist, data.artist_mb_url);
                setMBLink(DOM.mbAlbum, data.album_mb_url);
                if (data.loved) {
                    DOM.loved.style.display = 'block';
                    DOM.loved.href = data.user_url + '/loved';
                } else {
                    DOM.loved.style.display = 'none';
                }
                if (data.image) {
                    DOM.cover.src = data.image;
                    DOM.cover.style.display = 'block';
                    DOM.coverLink.href = data.image;
                    bg.style.backgroundImage = `url(${data.image})`;
                } else {
                    DOM.cover.style.display = 'none';
                    DOM.coverLink.removeAttribute('href');
                    DOM.bg.style.backgroundImage = 'none';
                }
            } catch (err) {
                console.error('NowPlaying error:', err);
                setLink(DOM.status, 'API RECONNECTING...', null);
            }
        }

        fetchNowPlaying();
        setInterval(fetchNowPlaying, POLL_MUSIC_MS);

    </script>

</body>

</html>
